name: Build

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_API_BASE_URL: https://api.tanguy.beer/api/v1
          VITE_KEYCLOAK_URL: https://auth.tanguy.beer
          VITE_KEYCLOAK_REALM: beermap-v2
          VITE_KEYCLOAK_CLIENT_ID: beermap-web-v2
          VITE_KEYCLOAK_GOOGLE_IDP_HINT: google
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/